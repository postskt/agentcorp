name: Make package public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set visibility
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /repos/postskt/agentcorp/packages/npm/agentcorp \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
