name: Test package install

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@postskt'

      - name: Install from GitHub Packages
        run: |
          mkdir -p /tmp/ac-test && cd /tmp/ac-test
          printf '@postskt:registry=https://npm.pkg.github.com\n' > .npmrc
          npm install @postskt/agentcorp --no-audit --no-fund
          echo "=== installed CLI ==="
          ./node_modules/.bin/agentcorp help | head -5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
